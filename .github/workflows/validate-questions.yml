# Runs the question-bank checks on every pull request and on pushes to main.
# NOTE: this file must sit at the REPOSITORY ROOT (.github/workflows/). If the app files live inside a
# sub-folder of the repo, uncomment working-directory below and put that folder's name there.
name: Validate question bank
on:
  pull_request:
    paths: ["questions.js", "tools/**", "**/questions.js", "**/tools/**"]
  push:
    branches: [main]
    paths: ["questions.js", "tools/**", "**/questions.js", "**/tools/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    # defaults:
    #   run:
    #     working-directory: naijauni-advisor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate questions
        run: node tools/validate-questions.js
